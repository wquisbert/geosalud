        body { 
            font-family: 'Inter', sans-serif; 
            overscroll-behavior: none; 
            -webkit-font-smoothing: antialiased;
        }

        /* --- ESTILOS DE PINES --- */
        .pin-marker {
            width: 34px; height: 34px; border-radius: 50% 50% 50% 0;
            background: #fff; position: absolute; transform: rotate(-45deg);
            box-shadow: -2px 4px 10px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
            border: 2px solid white; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform;
        }
        .pin-marker::after { content: ''; width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,0.3); position: absolute; }
        .pin-icon { transform: rotate(45deg); color: white; font-size: 16px; z-index: 2; }
        
        .pin-l1 { background: linear-gradient(135deg, #10b981, #047857); }
        .pin-l2 { background: linear-gradient(135deg, #f59e0b, #b45309); }
        .pin-l3 { background: linear-gradient(135deg, #64748b, #334155); }

        .custom-div-icon:hover .pin-marker { transform: rotate(-45deg) scale(1.2) translateY(-6px); z-index: 9999 !important; box-shadow: -4px 8px 15px rgba(0,0,0,0.5); }

        /* --- CLUSTERS PREMIUM --- */
        .marker-cluster { background-clip: padding-box; border-radius: 20px; transition: all 0.3s ease; }
        .marker-cluster div { width: 30px; height: 30px; margin-left: 5px; margin-top: 5px; text-align: center; border-radius: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
        .marker-cluster-small { background-color: rgba(250, 204, 21, 0.3); }
        .marker-cluster-small div { background-color: rgba(250, 204, 21, 0.95); color: #0f172a; border: 2px solid #fff; box-shadow: 0 4px 12px rgba(250, 204, 21, 0.4); }
        .marker-cluster-medium { background-color: rgba(234, 179, 8, 0.3); }
        .marker-cluster-medium div { background-color: rgba(234, 179, 8, 0.95); color: #0f172a; border: 2px solid #fff; box-shadow: 0 4px 12px rgba(234, 179, 8, 0.4); }
        
        /* --- POPUP GLASSMORPHISM --- */
        .modern-popup .leaflet-popup-content-wrapper {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.2);
            padding: 0; border: 1px solid rgba(255, 255, 255, 0.5); overflow: hidden;
        }
        .dark .modern-popup .leaflet-popup-content-wrapper { background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(250, 204, 21, 0.2); box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6); }
        .modern-popup .leaflet-popup-tip { background: rgba(255,255,255,0.85); }
        .dark .modern-popup .leaflet-popup-tip { background: rgba(30, 41, 59, 0.85); }
        .modern-popup a.leaflet-popup-close-button { color: #1e293b !important; top: 12px; right: 12px; background: rgba(0,0,0,0.05); border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .dark .modern-popup a.leaflet-popup-close-button { color: #f8fafc !important; background: rgba(255,255,255,0.1); }
        .modern-popup a.leaflet-popup-close-button:hover { background: #facc15; color: #0f172a !important; transform: scale(1.1); }

        /* --- CONTROLES Y UTILIDADES --- */
        .leaflet-control-zoom { border: none !important; box-shadow: 0 8px 20px rgba(0,0,0,0.15) !important; border-radius: 14px !important; overflow: hidden; }
        .leaflet-control-zoom a { background: rgba(255,255,255,0.9) !important; color: #1e293b !important; border-bottom: 1px solid #e2e8f0 !important; backdrop-filter: blur(10px); transition: background 0.2s; }
        .dark .leaflet-control-zoom a { background: rgba(30, 41, 59, 0.9) !important; color: #f8fafc !important; border-bottom: 1px solid #334155 !important; }
        .leaflet-control-zoom a:hover { background: #facc15 !important; color: #0f172a !important; }

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #475569; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #facc15; }
        
        .view-panel { display: none; height: calc(100vh - 76px); animation: fadeIn 0.4s ease-out; }
        .view-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .panel-transition { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR1DHcWzeJllMtxhIQlpaw6byDlbsji0L4w3SZaWTQDgdz2MdeJEGfB6peldYWgEeQUzgr0hP73zwwt/pub?output=csv';

        let rawData=[], filteredData=[], markers={}, map, markerClusterGroup, page=1;
        const perPage=12; 
        
        // Variables para Rutas Múltiples y Colores
        let routingControl = null; 
        let customRouteSegments = []; // Almacenará las líneas (polylines) de cada tramo dibujado
        const segmentColors = ['#3b82f6', '#ec4899', '#f97316', '#8b5cf6', '#14b8a6', '#ef4444', '#6366f1', '#84cc16']; // Paleta vibrante
        
        let globalMunicipios = [];
        let waypointCount = 0;
        let currentRouteData = [];
        let currentTotalKm = 0;
        let isSidebarOpen = false;

        // --- TEMA DINÁMICO ---
        const htmlNode = document.documentElement;
        let isDark = localStorage.getItem('theme') === 'dark';
        
        function applyTheme() {
            if(isDark) {
                htmlNode.classList.add('dark');
                document.getElementById('theme-icon').className = "ph-fill ph-sun text-xl text-brand-400";
            } else {
                htmlNode.classList.remove('dark');
                document.getElementById('theme-icon').className = "ph-fill ph-moon text-xl text-slate-600";
            }
            updateChartsTheme();
            updateCleanLayer();
        }

        function toggleTheme() { isDark = !isDark; localStorage.setItem('theme', isDark ? 'dark' : 'light'); applyTheme(); }

        // --- INICIALIZACIÓN ---
        const mapOptions = { zoomControl: false, preferCanvas: true, wheelDebounceTime: 150 };
        const layerCfg = { maxZoom: 22, maxNativeZoom: 18, keepBuffer: 4, updateWhenZooming: false, updateWhenIdle: true };
        const mapLayers = {
            osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { ...layerCfg, attribution: '© OSM' }),
            sat: L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { ...layerCfg, attribution: '© Google', maxNativeZoom: 20 }),
            clean_light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', layerCfg),
            clean_dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', layerCfg)
        };
        let currentLayerType = 'osm', currentLayerObj = mapLayers.osm;

        document.addEventListener('DOMContentLoaded', () => {
            applyTheme(); initMap(); initCharts(); loadData();
            document.getElementById('inputSearch').addEventListener('input', () => { page=1; execFilter(); });
            if(window.innerWidth >= 1024) toggleSidebar(true);
        });

        // --- NAVEGACIÓN ---
        function setView(viewName) {
            const activeClass = "flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-brand-400 text-darkbase shadow-md";
            const inactiveClass = "flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold transition-all text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-800 hover:shadow-sm";
            
            document.getElementById('btn-explore').className = inactiveClass;
            document.getElementById('btn-routes').className = inactiveClass;
            document.getElementById('btn-stats').className = inactiveClass;
            document.getElementById('view-map').classList.remove('active');
            document.getElementById('view-stats').classList.remove('active');

            if(viewName === 'explore') {
                document.getElementById('btn-explore').className = activeClass;
                document.getElementById('view-map').classList.add('active');
                document.getElementById('panel-explore').classList.remove('hidden'); document.getElementById('panel-explore').classList.add('flex');
                document.getElementById('panel-routes').classList.add('hidden'); document.getElementById('panel-routes').classList.remove('flex');
                setTimeout(()=>map.invalidateSize(), 200);
            } 
            else if(viewName === 'routes') {
                document.getElementById('btn-routes').className = activeClass;
                document.getElementById('view-map').classList.add('active');
                document.getElementById('panel-routes').classList.remove('hidden'); document.getElementById('panel-routes').classList.add('flex');
                document.getElementById('panel-explore').classList.add('hidden'); document.getElementById('panel-explore').classList.remove('flex');
                setTimeout(()=>map.invalidateSize(), 200);
            } 
            else if(viewName === 'stats') {
                document.getElementById('btn-stats').className = activeClass;
                document.getElementById('view-stats').classList.add('active');
                setTimeout(()=>{ch1.reflow();ch2.reflow();ch3.reflow()}, 200);
            }
        }

        function toggleSidebar(forceState = null) {
            const panel = document.getElementById('sidebarPanel'); const txt = document.getElementById('mobileToggleText');
            isSidebarOpen = forceState !== null ? forceState : !isSidebarOpen;
            if(isSidebarOpen) { panel.classList.remove('panel-collapsed'); txt.innerHTML = '<i class="ph-bold ph-caret-down"></i> Ocultar panel'; } 
            else { panel.classList.add('panel-collapsed'); txt.innerHTML = '<i class="ph-bold ph-caret-up"></i> Mostrar panel'; }
        }

        // --- MAPA Y FILTROS ---
        function initMap() {
            map = L.map('map', mapOptions).setView([-16.5000, -68.1193], 12);
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            map.addLayer(currentLayerObj);
            markerClusterGroup = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 45, spiderfyOnMaxZoom: true, disableClusteringAtZoom: 15, removeOutsideVisibleBounds: true, animate: true });
            map.addLayer(markerClusterGroup);
        }

        function setLayer(type, btn) {
            document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active')); if(btn) btn.classList.add('active');
            map.removeLayer(currentLayerObj); currentLayerType = type;
            currentLayerObj = (type === 'clean') ? (isDark ? mapLayers.clean_dark : mapLayers.clean_light) : mapLayers[type];
            map.addLayer(currentLayerObj); 
        }

        function updateCleanLayer() { if (currentLayerType === 'clean') { map.removeLayer(currentLayerObj); currentLayerObj = isDark ? mapLayers.clean_dark : mapLayers.clean_light; map.addLayer(currentLayerObj); } }

        function loadData() {
            Papa.parse(CSV_URL, {
                download: true, header: true, dynamicTyping: true, skipEmptyLines: true,
                complete: (res) => {
                    rawData = res.data.filter(r => r.Latitud && r.Longitud && r.NOMBRE);
                    const redes = [...new Set(rawData.map(d=>d.RED))].sort();
                    redes.forEach(r => document.getElementById('selRed').add(new Option(r,r)));
                    globalMunicipios = [...new Set(rawData.map(d=>d.MUNICIPIO))].sort();
                    agregarParada("ORIGEN"); agregarParada("DESTINO 1");
                    execFilter();
                }
            });
        }

        function filterRed() {
            const red = document.getElementById('selRed').value, m = document.getElementById('selMuni');
            m.innerHTML = '<option value="">MUNICIPIOS</option>'; m.disabled = !red;
            if(red) [...new Set(rawData.filter(d=>d.RED===red).map(d=>d.MUNICIPIO))].sort().forEach(mu=>m.add(new Option(mu,mu)));
            page=1; execFilter();
        }

        function execFilter() {
            const txt = document.getElementById('inputSearch').value.toLowerCase(), red = document.getElementById('selRed').value, mun = document.getElementById('selMuni').value;
            filteredData = rawData.filter(d => { const mt = (d.NOMBRE||'').toLowerCase().includes(txt) || String(d.COD_SNIS).includes(txt); return mt && (!red || d.RED===red) && (!mun || d.MUNICIPIO===mun); });
            document.getElementById('counter').innerText = filteredData.length; document.getElementById('kpi-total').innerText = filteredData.length;
            renderMap(); renderList(); updateChartsData();
        }

        function renderMap() {
            markerClusterGroup.clearLayers(); markers = {}; const bounds = L.latLngBounds(), markerList = [];
            filteredData.forEach(item => {
                let lvl = String(item.NIVEL).toLowerCase(), cssClass = 'pin-l1', iconClass = 'ph-first-aid', headerColor = 'bg-emerald-500';
                if(lvl.includes('2')) { cssClass = 'pin-l2'; iconClass = 'ph-hospital'; headerColor = 'bg-amber-500'; } 
                else if (lvl.includes('3')) { cssClass = 'pin-l3'; iconClass = 'ph-buildings'; headerColor = 'bg-slate-700'; }

                const icon = L.divIcon({ className: 'custom-div-icon', html: `<div class="pin-marker ${cssClass}"><i class="ph-fill ${iconClass} pin-icon"></i></div>`, iconSize: [34, 34], iconAnchor: [17, 34], popupAnchor: [0, -38] });
                const popupContent = `<div class="font-sans"><div class="${headerColor} h-3 w-full"></div><div class="p-6 relative"><span class="absolute top-5 right-5 text-[10px] font-mono text-darkbase bg-brand-400 px-3 py-1 rounded-full font-bold shadow-sm">COD: ${item.COD_SNIS}</span><p class="text-[10px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1.5">${item.NIVEL}</p><h3 class="text-[17px] font-black text-slate-900 dark:text-white leading-tight mb-5 pr-20">${item.NOMBRE}</h3><div class="space-y-3 text-xs text-slate-700 dark:text-slate-300 bg-slate-50 dark:bg-slate-800/50 p-4 rounded-2xl border border-slate-100 dark:border-slate-700/50"><div class="flex items-center gap-3"><div class="p-1.5 bg-yellow-100 dark:bg-yellow-900/40 text-brand-600 dark:text-brand-400 rounded-lg"><i class="ph-bold ph-map-pin text-sm"></i></div> <span class="font-semibold uppercase">${item.MUNICIPIO}</span></div></div></div></div>`;

                const m = L.marker([item.Latitud, item.Longitud], { icon: icon }).bindPopup(popupContent, { className: 'modern-popup' });
                m.on('click', () => { map.flyTo([item.Latitud, item.Longitud], 17, { duration: 0.8 }); });
                markerList.push(m); markers[item.COD_SNIS] = m; bounds.extend([item.Latitud, item.Longitud]);
            });
            markerClusterGroup.addLayers(markerList);
            if(filteredData.length) map.fitBounds(bounds, { paddingTopLeft: [window.innerWidth >= 1024 ? 440 : 20, 20], paddingBottomRight: [20, 20], maxZoom: 15, animate: true, duration: 1 });
        }

        function renderList() {
            const div = document.getElementById('resultList'); div.innerHTML = '';
            const maxPage = Math.ceil(filteredData.length / perPage) || 1; if(page > maxPage) page = maxPage; if(page < 1) page = 1;
            if(filteredData.length === 0) { div.innerHTML = '<div class="text-center p-8 text-slate-400 font-semibold">No hay resultados</div>'; document.getElementById('pgInfo').innerText = `0 / 0`; return; }
            filteredData.slice((page-1)*perPage, page*perPage).forEach(d => {
                let border = d.NIVEL.includes('3') ? 'border-l-slate-500' : (d.NIVEL.includes('2') ? 'border-l-amber-500' : 'border-l-emerald-500');
                const el = document.createElement('div');
                el.className = `p-4 bg-white dark:bg-slate-800/80 rounded-2xl border border-slate-100 dark:border-slate-700 border-l-[4px] ${border} shadow-sm hover:shadow-md cursor-pointer transition-all duration-300 hover:-translate-y-1 group`;
                el.innerHTML = `<h4 class="font-bold text-[13px] text-slate-800 dark:text-slate-100 group-hover:text-brand-500 dark:group-hover:text-brand-400 transition-colors line-clamp-1 mb-2 uppercase">${d.NOMBRE}</h4><div class="flex justify-between items-center"><span class="text-[10px] font-bold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-900/50 px-2.5 py-1 rounded-md uppercase">${d.MUNICIPIO}</span><div class="bg-slate-50 dark:bg-slate-700 p-1.5 rounded-full group-hover:bg-brand-400 group-hover:text-darkbase transition-colors"><i class="ph-bold ph-arrow-right text-slate-400 dark:text-slate-400 group-hover:text-darkbase text-[10px]"></i></div></div>`;
                el.onclick = () => { if(window.innerWidth < 1024) toggleSidebar(false); if(markers[d.COD_SNIS]) markerClusterGroup.zoomToShowLayer(markers[d.COD_SNIS], () => { map.flyTo([d.Latitud, d.Longitud], 18, { duration: 0.8 }); setTimeout(() => markers[d.COD_SNIS].openPopup(), 600); }); };
                div.appendChild(el);
            });
            document.getElementById('pgInfo').innerText = `${page} / ${maxPage}`;
        }
        function pg(d) { page+=d; renderList(); }

        // --- SISTEMA INTERACTIVO DE RUTAS POR TRAMOS (NUEVO) ---
        function agregarParada(label = null) {
            waypointCount++;
            const divId = `wp-row-${waypointCount}`;
            const div = document.createElement('div'); div.className = "flex items-center gap-2"; div.id = divId;
            let optionsHtml = `<option value="">${label || `DESTINO ${waypointCount - 1}`}...</option>`;
            globalMunicipios.forEach(m => { optionsHtml += `<option value="${m}">${m.toUpperCase()}</option>`; });
            let removeBtn = (waypointCount > 2) ? `<button onclick="removerParada('${divId}')" class="text-red-500 hover:text-red-700 bg-red-50 dark:bg-red-900/30 p-2 rounded-lg"><i class="ph-bold ph-trash"></i></button>` : `<div class="w-8"></div>`; 
            div.innerHTML = `<div class="badge-num bg-slate-800 dark:bg-slate-100 text-white dark:text-slate-900 w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-black flex-none">${waypointCount}</div><select class="wp-select flex-1 p-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-300 outline-none hover:border-brand-400 focus:ring-2 focus:ring-brand-400 cursor-pointer transition-all appearance-none uppercase shadow-sm">${optionsHtml}</select>${removeBtn}`;
            document.getElementById('waypoints-container').appendChild(div);
        }

        function removerParada(rowId) {
            document.getElementById(rowId).remove();
            document.querySelectorAll('.badge-num').forEach((b, index) => { b.innerText = index + 1; });
            waypointCount = document.querySelectorAll('.badge-num').length;
        }

        function limpiarTramosVisuales() {
            customRouteSegments.forEach(line => map.removeLayer(line));
            customRouteSegments = [];
        }

        function obtenerCentroMunicipioExacto(nombreMunicipio) {
            const establecimientos = rawData.filter(d => d.MUNICIPIO === nombreMunicipio);
            if (establecimientos.length === 0) return null;
            let capital = establecimientos.find(e => String(e.NIVEL).includes('3')) || establecimientos.find(e => String(e.NIVEL).includes('2')) || establecimientos.find(e => e.NOMBRE.toUpperCase().includes(nombreMunicipio.toUpperCase()));
            if (!capital) {
                let sumLat = 0, sumLng = 0; establecimientos.forEach(est => { sumLat += parseFloat(est.Latitud); sumLng += parseFloat(est.Longitud); });
                const avgLat = sumLat / establecimientos.length, avgLng = sumLng / establecimientos.length;
                let minDist = Infinity;
                establecimientos.forEach(est => {
                    const dist = Math.pow(parseFloat(est.Latitud) - avgLat, 2) + Math.pow(parseFloat(est.Longitud) - avgLng, 2);
                    if (dist < minDist) { minDist = dist; capital = est; }
                });
            }
            return L.latLng(parseFloat(capital.Latitud), parseFloat(capital.Longitud));
        }

        function calcularRuta() {
            const selects = document.querySelectorAll('.wp-select');
            const validWaypoints = [], validNames = [];
            selects.forEach(sel => {
                if (sel.value) { const pt = obtenerCentroMunicipioExacto(sel.value); if (pt) { validWaypoints.push(pt); validNames.push(sel.value.toUpperCase()); } }
            });
            if (validWaypoints.length < 2) { alert("Seleccione al menos un origen y un destino."); return; }

            if (routingControl) { map.removeControl(routingControl); limpiarTramosVisuales(); }

            routingControl = L.Routing.control({
                waypoints: validWaypoints,
                router: L.Routing.osrmv1({ language: 'es', profile: 'driving' }),
                lineOptions: { styles: [{ opacity: 0, weight: 0 }] }, // Ocultamos la línea nativa (la dibujaremos tramo por tramo)
                createMarker: function(i, wp, n) {
                    let color = (i === 0) ? 'bg-emerald-500' : ((i === n - 1) ? 'bg-red-500' : 'bg-slate-800');
                    const iconHtml = `<div class="w-6 h-6 rounded-full border-[3px] border-white shadow-[0_4px_10px_rgba(0,0,0,0.4)] ${color} flex items-center justify-center text-[11px] font-black text-white z-50">${i+1}</div>`;
                    return L.marker(wp.latLng, { icon: L.divIcon({ className: 'custom-route-marker', html: iconHtml, iconSize: [24, 24], iconAnchor: [12, 12] }) });
                },
                show: false, addWaypoints: false, fitSelectedRoutes: false // Lo controlaremos manualmente
            }).addTo(map);

            routingControl.on('routesfound', function(e) { generarReporteRuta(e.routes[0], validNames); });
        }

        function generarReporteRuta(route, names) {
            const container = document.getElementById('route-report'), content = document.getElementById('report-content'), totalLabel = document.getElementById('report-total-dist');
            content.innerHTML = ''; currentRouteData = []; limpiarTramosVisuales();
            
            const coords = route.coordinates, wpIndices = route.waypointIndices; 
            const boundsForZoom = L.latLngBounds();

            for(let i = 0; i < names.length - 1; i++) {
                let startIndex = wpIndices[i], endIndex = wpIndices[i+1];
                let segmentCoords = [], segmentDistMeters = 0;
                
                // Extraer coordenadas para este tramo específico
                for (let j = startIndex; j <= endIndex; j++) {
                    segmentCoords.push([coords[j].lat, coords[j].lng]);
                    boundsForZoom.extend([coords[j].lat, coords[j].lng]);
                    if (j < endIndex) segmentDistMeters += coords[j].distanceTo(coords[j+1]);
                }
                
                let distKm = (segmentDistMeters / 1000).toFixed(1);
                let tramColor = segmentColors[i % segmentColors.length];

                // Dibujar el tramo con su propio color
                let polyline = L.polyline(segmentCoords, { color: tramColor, weight: 6, opacity: 0.8, lineCap: 'round', lineJoin: 'round' }).addTo(map);
                customRouteSegments.push(polyline);
                
                currentRouteData.push({ tramo: i + 1, origen: names[i], destino: names[i+1], distancia: distKm });
                
                // Generar UI interactiva en el panel
                content.innerHTML += `
                    <div id="tram-card-${i}" onclick="resaltarTramo(${i})" class="tram-item cursor-pointer px-3 py-3 border-l-[6px] border-b border-slate-100 dark:border-slate-800 flex justify-between items-center text-xs hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors" style="border-left-color: ${tramColor}">
                        <div class="flex flex-col gap-1">
                            <span class="text-slate-500 dark:text-slate-400 text-[9px] font-black uppercase tracking-wider">TRAMO ${i+1}</span>
                            <span class="text-slate-800 dark:text-slate-200 font-bold flex items-center gap-1.5">${names[i]} <i class="ph-bold ph-arrow-right" style="color: ${tramColor}"></i> ${names[i+1]}</span>
                        </div>
                        <span class="font-black text-slate-800 dark:text-slate-200 px-2.5 py-1.5 rounded-lg border shadow-sm" style="background-color: ${tramColor}15; border-color: ${tramColor}40">${distKm} km</span>
                    </div>
                `;
            }
            
            // Ajustar vista a toda la ruta inicialmente
            map.fitBounds(boundsForZoom, { padding: [50, 50], animate: true });
            
            currentTotalKm = (route.summary.totalDistance / 1000).toFixed(1);
            container.classList.remove('hidden'); totalLabel.innerText = `${currentTotalKm} km`;
        }

        // Función para enfocar un tramo específico al hacer clic
        function resaltarTramo(index) {
            // 1. Restaurar el estilo de todos los tramos a la normalidad
            customRouteSegments.forEach((line, i) => {
                let color = segmentColors[i % segmentColors.length];
                line.setStyle({ weight: 5, opacity: 0.5 });
                document.getElementById(`tram-card-${i}`).classList.remove('bg-slate-100', 'dark:bg-slate-800');
            });
            
            // 2. Resaltar la línea seleccionada
            let selectedLine = customRouteSegments[index];
            selectedLine.setStyle({ weight: 10, opacity: 1 });
            selectedLine.bringToFront();
            
            // 3. Resaltar la tarjeta en el UI
            document.getElementById(`tram-card-${index}`).classList.add('bg-slate-100', 'dark:bg-slate-800');
            
            // 4. Volar hacia el tramo con el padding adecuado para no quedar detrás del menú
            const padLeft = window.innerWidth >= 1024 ? 440 : 20;
            map.fitBounds(selectedLine.getBounds(), { paddingTopLeft: [padLeft, 50], paddingBottomRight: [50, 50], animate: true, duration: 0.8 });
        }

        // --- EXPORTACIÓN A WORD ---
        function exportarWord() {
            if (currentRouteData.length === 0) return;
            const fechaActual = new Date().toLocaleDateString('es-BO');

            let tablaHTML = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head>
                    <meta charset='utf-8'>
                    <title>Reporte de Viáticos</title>
                    <style>
                        body { font-family: 'Arial', sans-serif; }
                        table { border-collapse: collapse; width: 100%; margin-top: 20px; font-size: 11pt; }
                        th, td { border: 1px solid #000; padding: 10px; text-align: left; }
                        th { background-color: #e2e8f0; font-weight: bold; text-align: center; }
                        h2, h4 { text-align: center; margin: 5px 0; }
                        .text-center { text-align: center; }
                        .text-right { text-align: right; }
                    </style>
                </head>
                <body>
                    <h2>SEDES LA PAZ</h2>
                    <h4>REPORTE DE RUTAS Y CÁLCULO DE VIÁTICOS</h4>
                    <p><strong>FECHA:</strong> ${fechaActual}</p>
                    <table>
                        <thead>
                            <tr><th>N° TRAMO</th><th>MUNICIPIO ORIGEN</th><th>MUNICIPIO DESTINO</th><th>DISTANCIA (KM)</th><th>MONTO DE VIÁTICO (Bs.)</th></tr>
                        </thead>
                        <tbody>
            `;
            currentRouteData.forEach(item => {
                tablaHTML += `<tr><td class="text-center">${item.tramo}</td><td>${item.origen}</td><td>${item.destino}</td><td class="text-right">${item.distancia}</td><td></td></tr>`;
            });
            tablaHTML += `
                        </tbody>
                        <tfoot>
                            <tr><td colspan="3" class="text-right" style="font-weight: bold;">TOTAL RECORRIDO:</td><td class="text-right" style="font-weight: bold;">${currentTotalKm}</td><td style="background-color: #f8fafc;"></td></tr>
                        </tfoot>
                    </table>
                    <br><br><br>
                    <p style="text-align:center;">_________________________________<br><strong>FIRMA RESPONSABLE</strong></p>
                </body>
                </html>
            `;
            
            const blob = new Blob(['\ufeff', tablaHTML], { type: 'application/msword' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Reporte_Viaticos_${fechaActual.replace(/\//g, '-')}.doc`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        // --- GRÁFICOS ---
        let ch1, ch2, ch3;
        function initCharts() {
            Highcharts.setOptions({ chart: { style: { fontFamily: 'Inter' } } });
            const cObj = { chart: { backgroundColor: 'transparent' }, title: { style: { fontWeight: '800', fontSize: '16px' } }, legend: { enabled: false }, credits: { enabled: false } };
            ch1 = Highcharts.chart('chart1', { ...cObj, chart: { ...cObj.chart, type: 'variablepie' }, title: { text: 'Nivel' }, series: [{ innerSize: '65%', name: 'Centros', data: [] }] });
            ch2 = Highcharts.chart('chart2', { ...cObj, chart: { ...cObj.chart, type: 'bar' }, title: { text: 'Subsector' }, xAxis: { categories: [] }, yAxis: { title: null }, series: [{ name: 'Total', data: [], colorByPoint: true, borderRadius: 4 }] });
            ch3 = Highcharts.chart('chart3', { ...cObj, chart: { ...cObj.chart, type: 'column' }, title: { text: 'Redes' }, xAxis: { type: 'category' }, yAxis: { title: null }, series: [{ name: 'Total', data: [], color: '#facc15', borderRadius: 6 }] });
            updateChartsTheme();
        }

        function updateChartsData() {
            const count = (k) => { const c={}; filteredData.forEach(i=>{let v=i[k]||'S/D';c[v]=(c[v]||0)+1;}); return Object.entries(c).map(([name,y])=>({name,y})).sort((a,b)=>b.y-a.y); };
            const d1 = count('NIVEL'); d1.forEach(p => { let n=p.name.toLowerCase(); if(n.includes('1')) p.color='#10b981'; if(n.includes('2')) p.color='#f59e0b'; if(n.includes('3')) p.color='#64748b'; });
            ch1.series[0].setData(d1);
            const d2 = count('SUBSECTOR'); ch2.xAxis[0].setCategories(d2.map(x=>x.name)); ch2.series[0].setData(d2.map(x=>x.y));
            ch3.series[0].setData(count('RED'));
        }

        function updateChartsTheme() {
            const tc = isDark ? '#f8fafc' : '#0f172a', gc = isDark ? '#334155' : '#e2e8f0';
            const tp = { title: { style: { color: tc } }, xAxis: { labels: { style: { color: tc } } }, yAxis: { labels: { style: { color: tc } }, gridLineColor: gc }, tooltip: { backgroundColor: isDark ? 'rgba(30, 41, 59, 0.95)' : 'rgba(255, 255, 255, 0.95)', style: { color: tc }, borderColor: gc, borderRadius: 12 } };
            if(ch1) ch1.update(tp); if(ch2) ch2.update(tp); if(ch3) ch3.update(tp);
        }
    </script>
</body>
</html>
