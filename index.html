<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visor Interactivo - Establecimientos de Salud</title>
    
    <!-- Configuración de Tailwind para Modo Oscuro -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { brand: '#facc15' } // Amarillo principal
                }
            }
        }
    </script>
    
    <!-- Leaflet & MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/variable-pie.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; overscroll-behavior: none; transition: background-color 0.3s; }

        /* --- ESTILOS DE MARCADORES (PINS) --- */
        .pin-marker {
            width: 36px; height: 36px; border-radius: 50% 50% 50% 0;
            background: #fff; position: absolute; transform: rotate(-45deg);
            box-shadow: -3px 5px 8px rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            border: 2px solid white; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .pin-marker::after { content: ''; width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,0.3); position: absolute; }
        .pin-icon { transform: rotate(45deg); color: white; font-size: 18px; z-index: 2; }
        
        .pin-l1 { background: linear-gradient(135deg, #10b981 0%, #047857 100%); }
        .pin-l2 { background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%); }
        .pin-l3 { background: linear-gradient(135deg, #4b5563 0%, #1f2937 100%); }

        .custom-div-icon:hover .pin-marker { transform: rotate(-45deg) scale(1.15) translateY(-8px); z-index: 999 !important; box-shadow: -5px 10px 20px rgba(0,0,0,0.5); }

        /* --- CLUSTERS --- */
        .marker-cluster-small { background-color: rgba(250, 204, 21, 0.4); }
        .marker-cluster-small div { background-color: rgba(250, 204, 21, 0.95); color: #111827; font-weight: 800; border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .marker-cluster-medium { background-color: rgba(234, 179, 8, 0.4); }
        .marker-cluster-medium div { background-color: rgba(234, 179, 8, 0.95); color: #111827; font-weight: 800; border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* --- POPUP GLASSMORPHISM (Dinámico) --- */
        .modern-popup .leaflet-popup-content-wrapper {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px);
            border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            padding: 0; border: 1px solid rgba(250, 204, 21, 0.5); overflow: hidden;
            transition: all 0.3s;
        }
        .modern-popup .leaflet-popup-tip { background: rgba(255,255,255,0.95); }
        .modern-popup a.leaflet-popup-close-button {
            color: #1f2937 !important; top: 12px; right: 12px;
            background: rgba(0,0,0,0.1); border-radius: 50%; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .modern-popup a.leaflet-popup-close-button:hover { background: #facc15; color: #111827 !important; transform: scale(1.1); }

        /* MODO OSCURO PARA EL POPUP */
        .dark .modern-popup .leaflet-popup-content-wrapper { background: rgba(31, 41, 55, 0.95); border-color: rgba(250, 204, 21, 0.3); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        .dark .modern-popup .leaflet-popup-tip { background: rgba(31, 41, 55, 0.95); }
        .dark .modern-popup a.leaflet-popup-close-button { color: #f3f4f6 !important; background: rgba(255,255,255,0.2); }

        /* --- CONTROLES LEAFLET --- */
        .leaflet-control-zoom { border: none !important; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2) !important; border-radius: 12px !important; overflow: hidden; }
        .leaflet-control-zoom a { background: rgba(255,255,255,0.9) !important; color: #1f2937 !important; border-bottom: 1px solid #e5e7eb !important; transition: all 0.2s; }
        .leaflet-control-zoom a:hover { background: #facc15 !important; color: #111827 !important; }
        .dark .leaflet-control-zoom a { background: rgba(31, 41, 55, 0.9) !important; color: #f3f4f6 !important; border-color: #374151 !important; }

        /* Utilidades UI */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #4b5563; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #facc15; }
        
        .view-panel { display: none; height: calc(100vh - 70px); animation: fadeIn 0.3s ease-out; }
        .view-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .panel-transition { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .panel-collapsed { transform: translateY(calc(100% - 70px)); }
        @media (min-width: 1024px) { .panel-collapsed { transform: translateX(0); } }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-300">

    <!-- NAVBAR (Dinámico Claro/Oscuro) -->
    <nav class="bg-white dark:bg-gray-800 shadow-md dark:shadow-xl z-50 h-[70px] flex-none border-b border-gray-200 dark:border-gray-700 transition-colors duration-300">
        <div class="container mx-auto px-4 lg:px-6 h-full flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-brand text-gray-900 p-2 rounded-xl shadow-[0_0_15px_rgba(250,204,21,0.3)] transform transition hover:scale-105">
                    <i class="ph-bold ph-hospital text-2xl"></i>
                </div>
                <div class="hidden sm:block">
                    <h1 class="text-lg font-extrabold tracking-tight leading-none text-gray-900 dark:text-white">SEDES LA PAZ</h1>
                    <p class="text-[10px] text-yellow-600 dark:text-yellow-400 font-bold uppercase tracking-widest mt-0.5">Visor Interactivo</p>
                </div>
            </div>
            <div class="flex bg-gray-100 dark:bg-gray-900 p-1 rounded-xl gap-1 border border-gray-200 dark:border-gray-700 transition-colors">
                <button onclick="setView('map')" id="btn-map" class="flex items-center gap-2 px-4 lg:px-6 py-2 rounded-lg text-sm font-bold transition-all bg-brand text-gray-900 shadow-md">
                    <i class="ph-bold ph-map-pin text-lg"></i> <span class="hidden sm:inline">Mapa</span>
                </button>
                <button onclick="setView('stats')" id="btn-stats" class="flex items-center gap-2 px-4 lg:px-6 py-2 rounded-lg text-sm font-bold transition-all text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white hover:bg-gray-200 dark:hover:bg-gray-700">
                    <i class="ph-bold ph-chart-bar text-lg"></i> <span class="hidden sm:inline">Datos</span>
                </button>
                <div class="w-px bg-gray-300 dark:bg-gray-700 mx-1 my-1"></div>
                <button onclick="toggleTheme()" id="btn-theme" class="flex items-center justify-center w-10 py-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">
                    <i class="ph-bold ph-moon text-xl" id="theme-icon"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- VISTA MAPA -->
    <div id="view-map" class="view-panel active relative w-full">
        <!-- Mapa de fondo -->
        <div id="map" class="absolute inset-0 z-0 bg-gray-200 dark:bg-gray-900 transition-colors"></div>
        
        <!-- Controles Flotantes del Mapa (Derecha) -->
        <div class="absolute top-4 right-4 z-[400] bg-white/90 dark:bg-gray-800/90 backdrop-blur-md rounded-2xl shadow-xl border border-gray-200 dark:border-gray-700 p-1.5 flex flex-col gap-1 w-12 hover:w-36 transition-all duration-300 overflow-hidden group">
            <button onclick="setLayer('osm')" class="flex items-center gap-3 p-2.5 hover:bg-yellow-50 dark:hover:bg-gray-700 rounded-xl text-gray-800 dark:text-gray-200 text-xs font-bold transition-colors w-full whitespace-nowrap">
                <i class="ph-fill ph-road-horizon text-brand text-xl flex-none"></i> <span class="opacity-0 group-hover:opacity-100 transition-opacity delay-100">Calles</span>
            </button>
            <button onclick="setLayer('sat')" class="flex items-center gap-3 p-2.5 hover:bg-yellow-50 dark:hover:bg-gray-700 rounded-xl text-gray-800 dark:text-gray-200 text-xs font-bold transition-colors w-full whitespace-nowrap">
                <i class="ph-fill ph-globe-hemisphere-west text-emerald-500 text-xl flex-none"></i> <span class="opacity-0 group-hover:opacity-100 transition-opacity delay-100">Satélite</span>
            </button>
            <button onclick="setLayer('clean')" class="flex items-center gap-3 p-2.5 hover:bg-yellow-50 dark:hover:bg-gray-700 rounded-xl text-gray-800 dark:text-gray-200 text-xs font-bold transition-colors w-full whitespace-nowrap">
                <i class="ph-fill ph-map-trifold text-gray-400 text-xl flex-none"></i> <span class="opacity-0 group-hover:opacity-100 transition-opacity delay-100">Limpio</span>
            </button>
        </div>

        <!-- Panel Flotante Izquierdo -->
        <div id="sidebarPanel" class="absolute bottom-0 left-0 lg:bottom-auto lg:top-4 lg:left-4 w-full lg:w-[400px] h-[70vh] lg:h-[calc(100vh-100px)] z-[400] flex flex-col pointer-events-none panel-transition panel-collapsed lg:panel-collapsed-none">
            
            <div class="pointer-events-auto bg-white/95 dark:bg-gray-900/95 backdrop-blur-xl lg:rounded-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.1)] dark:shadow-[0_-10px_40px_rgba(0,0,0,0.5)] lg:shadow-2xl border border-gray-200 dark:border-gray-700 flex flex-col h-full overflow-hidden rounded-t-3xl transition-colors duration-300">
                
                <div class="lg:hidden w-full h-12 flex justify-center items-center cursor-pointer bg-gray-50/50 dark:bg-gray-800/50 border-b border-gray-200 dark:border-gray-700" onclick="toggleSidebar()">
                    <div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full"></div>
                    <span id="mobileToggleText" class="absolute left-6 text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest"><i class="ph-bold ph-magnifying-glass"></i> Buscar</span>
                </div>

                <!-- Buscadores -->
                <div class="p-5 flex-none bg-gray-50/50 dark:bg-gray-800/50 relative border-b border-gray-200 dark:border-gray-700">
                    <div class="relative group mb-3">
                        <input type="text" id="inputSearch" placeholder="Buscar por nombre o código..." class="w-full pl-11 pr-4 py-3 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm font-semibold text-gray-900 dark:text-white focus:ring-2 focus:ring-brand focus:border-brand outline-none transition-all shadow-sm">
                        <i class="ph-bold ph-magnifying-glass absolute left-3.5 top-3.5 text-gray-400 text-lg group-focus-within:text-yellow-500 transition-colors"></i>
                    </div>
                    <div class="flex gap-2">
                        <select id="selRed" onchange="filterRed()" class="w-1/2 p-2.5 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-xs font-bold text-gray-700 dark:text-gray-300 outline-none hover:border-brand focus:ring-2 focus:ring-brand cursor-pointer shadow-sm transition-all"><option value="">Redes</option></select>
                        <select id="selMuni" onchange="execFilter()" class="w-1/2 p-2.5 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-xs font-bold text-gray-700 dark:text-gray-300 outline-none hover:border-brand focus:ring-2 focus:ring-brand cursor-pointer shadow-sm transition-all disabled:opacity-50" disabled><option value="">Municipios</option></select>
                    </div>
                </div>

                <div class="p-3 bg-gray-100 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center text-xs font-bold uppercase tracking-wider flex-none text-gray-500 dark:text-gray-400">
                    <span>Resultados: <span id="counter" class="text-gray-900 dark:text-white bg-gray-200 dark:bg-gray-700 px-2 py-0.5 rounded-md ml-1">0</span></span>
                </div>
                
                <div id="resultList" class="flex-1 overflow-y-auto p-3 space-y-3 custom-scroll"></div>
                
                <!-- Paginación -->
                <div class="p-3 border-t border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-800 flex-none transition-colors">
                    <button onclick="pg(-1)" class="px-3 py-2 bg-white dark:bg-gray-700 hover:bg-yellow-100 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-200 rounded-lg transition-colors font-bold text-xs border border-gray-200 dark:border-gray-600 shadow-sm"><i class="ph-bold ph-caret-left"></i> Ant</button>
                    <span id="pgInfo" class="text-xs font-extrabold text-gray-700 dark:text-gray-300">1 / 1</span>
                    <button onclick="pg(1)" class="px-3 py-2 bg-white dark:bg-gray-700 hover:bg-yellow-100 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-200 rounded-lg transition-colors font-bold text-xs border border-gray-200 dark:border-gray-600 shadow-sm">Sig <i class="ph-bold ph-caret-right"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- VISTA ESTADÍSTICAS -->
    <div id="view-stats" class="view-panel container mx-auto p-4 md:p-6 overflow-y-auto custom-scroll">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-10">
            <div class="lg:col-span-3 bg-gradient-to-r from-yellow-400 via-yellow-500 to-yellow-600 p-8 rounded-3xl shadow-xl text-gray-900 flex justify-between items-center relative overflow-hidden transform transition hover:scale-[1.01]">
                <div class="z-10">
                    <h2 class="text-xl font-bold uppercase tracking-widest opacity-80 mb-1">Total Registros</h2>
                    <span class="text-7xl font-extrabold drop-shadow-md tracking-tighter" id="kpi-total">0</span>
                </div>
                <i class="ph-duotone ph-buildings text-9xl opacity-20 absolute -right-4 -bottom-4 transform rotate-12"></i>
            </div>

            <div class="bg-white dark:bg-gray-800 p-5 rounded-3xl shadow-lg border border-gray-200 dark:border-gray-700 transition-colors"><div id="chart1" class="w-full h-[300px]"></div></div>
            <div class="bg-white dark:bg-gray-800 p-5 rounded-3xl shadow-lg border border-gray-200 dark:border-gray-700 transition-colors"><div id="chart2" class="w-full h-[300px]"></div></div>
            <div class="md:col-span-2 lg:col-span-3 bg-white dark:bg-gray-800 p-5 rounded-3xl shadow-lg border border-gray-200 dark:border-gray-700 transition-colors"><div id="chart3" class="w-full h-[400px]"></div></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR1DHcWzeJllMtxhIQlpaw6byDlbsji0L4w3SZaWTQDgdz2MdeJEGfB6peldYWgEeQUzgr0hP73zwwt/pub?output=csv';

        let rawData=[], filteredData=[], markers={}, map, markerClusterGroup, page=1;
        const perPage=15; 
        let isSidebarOpen = false;

        // --- SISTEMA DE TEMA (DARK/LIGHT) ---
        const htmlNode = document.documentElement;
        let isDark = false; // Empezamos en modo claro por defecto
        
        function toggleTheme() {
            isDark = !isDark;
            if(isDark) {
                htmlNode.classList.add('dark');
                document.getElementById('theme-icon').className = "ph-bold ph-sun text-xl text-yellow-400";
            } else {
                htmlNode.classList.remove('dark');
                document.getElementById('theme-icon').className = "ph-bold ph-moon text-xl";
            }
            updateChartsTheme();
        }

        // --- CAPAS LEAFLET (Satelital de Google Optimizada) ---
        const mapLayers = {
            osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxNativeZoom: 19, maxZoom: 22, keepBuffer: 4, updateWhenIdle: true }),
            clean: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxNativeZoom: 19, maxZoom: 22, keepBuffer: 4, updateWhenIdle: true }),
            // Google Maps Satellite es el más rápido. Configuramos updateWhenZooming: false para mayor fluidez.
            sat: L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { 
                maxNativeZoom: 20, maxZoom: 22, 
                keepBuffer: 8, updateWhenIdle: true, updateWhenZooming: false,
                attribution: '© Google'
            })
        };
        let currentLayer = mapLayers.osm;

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            initCharts();
            loadData();
            document.getElementById('inputSearch').addEventListener('input', () => { page=1; execFilter(); });
            if(window.innerWidth >= 1024) toggleSidebar(true);
        });

        function toggleSidebar(forceState = null) {
            const panel = document.getElementById('sidebarPanel');
            const txt = document.getElementById('mobileToggleText');
            isSidebarOpen = forceState !== null ? forceState : !isSidebarOpen;
            
            if(isSidebarOpen) {
                panel.classList.remove('panel-collapsed');
                txt.innerHTML = '<i class="ph-bold ph-caret-down"></i> Ocultar';
            } else {
                panel.classList.add('panel-collapsed');
                txt.innerHTML = '<i class="ph-bold ph-magnifying-glass"></i> Buscar';
            }
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([-16.5000, -68.1193], 12);
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            map.addLayer(currentLayer);
            
            markerClusterGroup = L.markerClusterGroup({
                chunkedLoading: true, maxClusterRadius: 40, spiderfyOnMaxZoom: true,
                disableClusteringAtZoom: 16
            });
            map.addLayer(markerClusterGroup);
        }

        function setLayer(type) {
            map.removeLayer(currentLayer); 
            currentLayer = mapLayers[type];
            map.addLayer(currentLayer); 
        }

        function loadData() {
            Papa.parse(CSV_URL, {
                download: true, header: true, dynamicTyping: true, skipEmptyLines: true,
                complete: (res) => {
                    rawData = res.data.filter(r => r.Latitud && r.Longitud && r.NOMBRE);
                    const redes = [...new Set(rawData.map(d=>d.RED))].sort();
                    redes.forEach(r => document.getElementById('selRed').add(new Option(r,r)));
                    execFilter();
                }
            });
        }

        function filterRed() {
            const red = document.getElementById('selRed').value;
            const m = document.getElementById('selMuni');
            m.innerHTML = '<option value="">Municipios</option>'; m.disabled = !red;
            if(red) [...new Set(rawData.filter(d=>d.RED===red).map(d=>d.MUNICIPIO))].sort().forEach(mu=>m.add(new Option(mu,mu)));
            page=1; execFilter();
        }

        function execFilter() {
            const txt = document.getElementById('inputSearch').value.toLowerCase();
            const red = document.getElementById('selRed').value;
            const mun = document.getElementById('selMuni').value;

            filteredData = rawData.filter(d => {
                const mt = (d.NOMBRE||'').toLowerCase().includes(txt) || String(d.COD_SNIS).includes(txt);
                return mt && (!red || d.RED===red) && (!mun || d.MUNICIPIO===mun);
            });

            document.getElementById('counter').innerText = filteredData.length;
            document.getElementById('kpi-total').innerText = filteredData.length;
            renderMap(); renderList(); updateChartsData();
        }

        function renderMap() {
            markerClusterGroup.clearLayers();
            markers = {};
            const bounds = L.latLngBounds();
            const markerList = [];

            filteredData.forEach(item => {
                let lvl = String(item.NIVEL).toLowerCase();
                let cssClass = 'pin-l1'; let iconClass = 'ph-first-aid'; let headerColor = 'bg-emerald-500';

                if(lvl.includes('2')) { cssClass = 'pin-l2'; iconClass = 'ph-hospital'; headerColor = 'bg-amber-500'; } 
                else if (lvl.includes('3')) { cssClass = 'pin-l3'; iconClass = 'ph-buildings'; headerColor = 'bg-gray-800 dark:bg-gray-600'; }

                const icon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="pin-marker ${cssClass}"><i class="ph-fill ${iconClass} pin-icon"></i></div>`,
                    iconSize: [36, 36], iconAnchor: [18, 36], popupAnchor: [0, -40]
                });

                const popupContent = `
                    <div class="font-sans">
                        <div class="${headerColor} h-2.5 w-full"></div>
                        <div class="p-6 relative">
                            <span class="absolute top-4 right-4 text-[10px] font-mono text-gray-800 bg-brand px-2.5 py-1 rounded-full font-bold shadow-sm">COD: ${item.COD_SNIS}</span>
                            <p class="text-[10px] font-extrabold text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-1">${item.NIVEL}</p>
                            <h3 class="text-lg font-extrabold text-gray-900 dark:text-white leading-tight mb-4 pr-16">${item.NOMBRE}</h3>
                            
                            <div class="space-y-2.5 text-xs text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700">
                                <div class="flex items-center gap-3"><div class="p-1.5 bg-yellow-100 dark:bg-yellow-900/30 text-yellow-600 dark:text-brand rounded-lg"><i class="ph-bold ph-map-pin text-sm"></i></div> <span class="font-bold">${item.MUNICIPIO}</span></div>
                                <div class="flex items-center gap-3"><div class="p-1.5 bg-yellow-100 dark:bg-yellow-900/30 text-yellow-600 dark:text-brand rounded-lg"><i class="ph-bold ph-users-three text-sm"></i></div> <span class="font-medium">Red: ${item.RED}</span></div>
                                <div class="flex items-center gap-3"><div class="p-1.5 bg-yellow-100 dark:bg-yellow-900/30 text-yellow-600 dark:text-brand rounded-lg"><i class="ph-bold ph-tag text-sm"></i></div> <span class="font-medium">${item.SUBSECTOR}</span></div>
                            </div>
                        </div>
                    </div>
                `;

                const m = L.marker([item.Latitud, item.Longitud], { icon: icon }).bindPopup(popupContent, { className: 'modern-popup' });
                m.on('click', () => { map.flyTo([item.Latitud, item.Longitud], 17, { duration: 1.2 }); });
                
                markerList.push(m);
                markers[item.COD_SNIS] = m;
                bounds.extend([item.Latitud, item.Longitud]);
            });

            markerClusterGroup.addLayers(markerList);
            const padLeft = window.innerWidth >= 1024 ? 420 : 20;
            if(filteredData.length) map.fitBounds(bounds, { paddingTopLeft: [padLeft, 20], paddingBottomRight: [20, 20], maxZoom: 15 });
        }

        function renderList() {
            const div = document.getElementById('resultList'); div.innerHTML = '';
            const maxPage = Math.ceil(filteredData.length / perPage) || 1;
            if(page > maxPage) page = maxPage; if(page < 1) page = 1;

            if(filteredData.length === 0) {
                div.innerHTML = '<div class="text-center p-6 text-gray-400 font-semibold"><i class="ph-duotone ph-warning-circle text-4xl mb-2"></i><br>No hay resultados</div>';
                document.getElementById('pgInfo').innerText = `0 / 0`; return;
            }

            filteredData.slice((page-1)*perPage, page*perPage).forEach(d => {
                let border = 'border-l-emerald-500';
                if(String(d.NIVEL).toLowerCase().includes('2')) border = 'border-l-amber-500';
                if(String(d.NIVEL).toLowerCase().includes('3')) border = 'border-l-gray-600';

                const el = document.createElement('div');
                el.className = `p-3 bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700 border-l-[4px] ${border} shadow-sm hover:shadow-md cursor-pointer transition-all duration-200 hover:-translate-y-0.5 group`;
                el.innerHTML = `
                    <h4 class="font-bold text-[13px] text-gray-800 dark:text-gray-200 group-hover:text-brand transition-colors line-clamp-1">${d.NOMBRE}</h4>
                    <div class="flex justify-between items-center mt-1.5">
                        <span class="text-[10px] font-bold text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-700 px-2 py-0.5 rounded">${d.MUNICIPIO}</span>
                        <i class="ph-bold ph-arrow-right text-gray-300 dark:text-gray-600 group-hover:text-brand text-sm transition-colors"></i>
                    </div>
                `;
                el.onclick = () => {
                    if(window.innerWidth < 1024) toggleSidebar(false);
                    if(markers[d.COD_SNIS]) {
                        markerClusterGroup.zoomToShowLayer(markers[d.COD_SNIS], () => {
                            map.flyTo([d.Latitud, d.Longitud], 18, { duration: 1 });
                            setTimeout(() => markers[d.COD_SNIS].openPopup(), 800);
                        });
                    }
                };
                div.appendChild(el);
            });
            document.getElementById('pgInfo').innerText = `${page} / ${maxPage}`;
        }
        function pg(d) { page+=d; renderList(); }

        let ch1, ch2, ch3;
        function initCharts() {
            Highcharts.setOptions({ chart: { style: { fontFamily: 'Inter' } } });
            
            const commonObj = { 
                chart: { backgroundColor: 'transparent' }, 
                title: { style: { fontWeight: '800', fontSize: '16px' } },
                legend: { enabled: false }, credits: { enabled: false }
            };

            ch1 = Highcharts.chart('chart1', { ...commonObj, chart: { ...commonObj.chart, type: 'variablepie' }, title: { text: 'Nivel de Atención' }, series: [{ innerSize: '60%', name: 'Centros', data: [] }] });
            ch2 = Highcharts.chart('chart2', { ...commonObj, chart: { ...commonObj.chart, type: 'bar' }, title: { text: 'Subsector' }, xAxis: { categories: [] }, yAxis: { title: null }, series: [{ name: 'Total', data: [], colorByPoint: true }] });
            ch3 = Highcharts.chart('chart3', { ...commonObj, chart: { ...commonObj.chart, type: 'column' }, title: { text: 'Establecimientos por Red' }, xAxis: { type: 'category' }, yAxis: { title: null }, series: [{ name: 'Total', data: [], color: '#facc15', borderRadius: 4 }] });
            
            updateChartsTheme(); // Aplicar colores iniciales (claro)
        }

        function updateChartsData() {
            const count = (k) => { const c={}; filteredData.forEach(i=>{let v=i[k]||'S/D';c[v]=(c[v]||0)+1;}); return Object.entries(c).map(([name,y])=>({name,y})).sort((a,b)=>b.y-a.y); };
            
            const d1 = count('NIVEL'); 
            d1.forEach(p => { 
                let n=p.name.toLowerCase(); 
                if(n.includes('1')) p.color='#10b981'; 
                if(n.includes('2')) p.color='#f59e0b'; 
                if(n.includes('3')) p.color='#6b7280'; 
            });
            ch1.series[0].setData(d1);
            
            const d2 = count('SUBSECTOR'); 
            ch2.xAxis[0].setCategories(d2.map(x=>x.name)); ch2.series[0].setData(d2.map(x=>x.y));
            ch3.series[0].setData(count('RED'));
        }

        // Actualiza los colores de los gráficos cuando se cambia de Claro a Oscuro
        function updateChartsTheme() {
            const textColor = isDark ? '#f3f4f6' : '#1f2937';
            const gridColor = isDark ? '#374151' : '#e5e7eb';
            
            const themeParams = {
                title: { style: { color: textColor } },
                xAxis: { labels: { style: { color: textColor } } },
                yAxis: { labels: { style: { color: textColor } }, gridLineColor: gridColor },
                tooltip: { backgroundColor: isDark ? 'rgba(31, 41, 55, 0.9)' : 'rgba(255, 255, 255, 0.9)', style: { color: textColor }, borderWidth: 1, borderColor: gridColor, borderRadius: 10 }
            };

            if(ch1) ch1.update(themeParams);
            if(ch2) ch2.update(themeParams);
            if(ch3) ch3.update(themeParams);
        }

        function setView(v) {
            document.querySelectorAll('.view-panel').forEach(e=>e.classList.remove('active')); 
            document.getElementById('view-'+v).classList.add('active');
            
            const b1=document.getElementById('btn-map'), b2=document.getElementById('btn-stats');
            const activeClass = "flex items-center gap-2 px-4 lg:px-6 py-2 rounded-lg text-sm font-bold transition-all bg-brand text-gray-900 shadow-md";
            const inactiveClass = "flex items-center gap-2 px-4 lg:px-6 py-2 rounded-lg text-sm font-bold transition-all text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white hover:bg-gray-200 dark:hover:bg-gray-700";
            
            if(v==='map'){ 
                b1.className=activeClass; b2.className=inactiveClass; 
                setTimeout(()=>map.invalidateSize(),100); 
            } else { 
                b2.className=activeClass; b1.className=inactiveClass; 
                setTimeout(()=>{ch1.reflow();ch2.reflow();ch3.reflow()},100); 
            }
        }
    </script>
</body>
</html>
