<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura - GeoSalud</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/variable-pie.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }

        /* --- 1. ESTILOS DE MARCADORES (PINS) MEJORADOS --- */
        .pin-marker {
            width: 36px; height: 36px;
            border-radius: 50% 50% 50% 0;
            background: #fff;
            position: absolute;
            transform: rotate(-45deg);
            box-shadow: -3px 5px 5px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
            border: 2px solid white;
            transition: all 0.2s ease-out;
        }
        .pin-marker::after {
            content: ''; width: 20px; height: 20px;
            border-radius: 50%; background: rgba(255,255,255,0.2);
            position: absolute;
        }
        /* Icono dentro del Pin (se rota 45deg para corregir la rotación del padre) */
        .pin-icon {
            transform: rotate(45deg);
            color: white;
            font-size: 18px;
            z-index: 2;
        }
        /* Colores por Nivel */
        .pin-l1 { background: linear-gradient(135deg, #10b981 0%, #059669 100%); } /* Verde */
        .pin-l2 { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); } /* Naranja */
        .pin-l3 { background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%); } /* Rojo Sangre */

        /* Animación Hover */
        .custom-div-icon:hover .pin-marker {
            transform: rotate(-45deg) scale(1.2) translateY(-10px);
            z-index: 999;
        }

        /* --- 2. POPUP MODERNO (Glassmorphism) --- */
        .modern-popup .leaflet-popup-content-wrapper {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 0; border: 1px solid white;
        }
        .modern-popup .leaflet-popup-content { margin: 0; width: 300px !important; }
        .modern-popup .leaflet-popup-tip { background: white; }
        .modern-popup a.leaflet-popup-close-button {
            color: white !important; top: 8px; right: 8px;
            background: rgba(0,0,0,0.2); border-radius: 50%;
            width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
        }

        /* Utilidades */
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .view-panel { display: none; height: calc(100vh - 70px); }
        .view-panel.active { display: grid; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800">

    <nav class="bg-[#8B0000] text-white shadow-xl z-50 h-[70px] flex-none">
        <div class="container mx-auto px-6 h-full flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="bg-white/10 p-2 rounded-xl backdrop-blur border border-white/10">
                    <i class="ph-fill ph-hospital text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight leading-none">SEDES LA PAZ / SUISD</h1>
                    <p class="text-[10px] text-red-200 uppercase tracking-widest mt-0.5">Visor Establecimientos de Salud</p>
                </div>
            </div>
            <div class="flex bg-black/20 p-1 rounded-xl gap-1">
                <button onclick="setView('map')" id="btn-map" class="flex items-center gap-2 px-5 py-2 rounded-lg text-xs font-bold transition-all bg-white text-[#8B0000] shadow-md transform hover:scale-105">
                    <i class="ph-bold ph-map-pin text-lg"></i> Mapa
                </button>
                <button onclick="setView('stats')" id="btn-stats" class="flex items-center gap-2 px-5 py-2 rounded-lg text-xs font-bold transition-all text-red-100 hover:bg-white/10">
                    <i class="ph-bold ph-chart-bar text-lg"></i> Estadísticas
                </button>
            </div>
        </div>
    </nav>

    <div id="view-map" class="view-panel active container mx-auto p-4 md:p-6 gap-6 grid-cols-1 lg:grid-cols-12 min-h-0">
        
        <div class="lg:col-span-4 flex flex-col gap-4 h-full min-h-0">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex-none">
                <div class="relative group mb-4">
                    <input type="text" id="inputSearch" placeholder="Buscar establecimiento..." class="w-full pl-10 pr-4 py-3 bg-gray-50 rounded-xl text-sm font-medium focus:ring-2 focus:ring-red-900 outline-none transition">
                    <i class="ph-bold ph-magnifying-glass absolute left-3 top-3.5 text-gray-400"></i>
                </div>
                <div class="flex gap-3">
                    <select id="selRed" onchange="filterRed()" class="w-1/2 p-2 bg-gray-50 rounded-lg text-xs font-bold text-gray-600 outline-none"><option value="">Todas las Redes</option></select>
                    <select id="selMuni" onchange="execFilter()" class="w-1/2 p-2 bg-gray-50 rounded-lg text-xs font-bold text-gray-600 outline-none" disabled><option value="">Todos</option></select>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 flex-1 overflow-hidden flex flex-col">
                <div class="p-3 bg-gray-50 border-b flex justify-between items-center text-[10px] text-gray-500 font-bold uppercase">
                    <span>Resultados (<span id="counter">0</span>)</span>
                    <div class="flex gap-2">
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> N1</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-500"></span> N2</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-red-800"></span> N3</span>
                    </div>
                </div>
                <div id="resultList" class="flex-1 overflow-y-auto p-3 space-y-2 custom-scroll"></div>
                <div class="p-3 border-t flex justify-center gap-4 bg-white">
                    <button onclick="pg(-1)" class="p-1 hover:bg-gray-100 rounded"><i class="ph-bold ph-caret-left"></i></button>
                    <span id="pgInfo" class="text-xs font-bold pt-1">1</span>
                    <button onclick="pg(1)" class="p-1 hover:bg-gray-100 rounded"><i class="ph-bold ph-caret-right"></i></button>
                </div>
            </div>
        </div>

        <div class="lg:col-span-8 h-full rounded-2xl overflow-hidden shadow-lg border border-gray-200 relative group">
            <div id="map" class="h-full w-full z-0 bg-slate-100"></div>
            
            <div class="absolute top-4 right-4 z-[400] bg-white rounded-xl shadow-lg border border-gray-100 p-1 flex flex-col gap-1">
                <button onclick="setLayer('osm')" class="flex items-center gap-2 p-2 hover:bg-blue-50 rounded-lg text-gray-600 text-xs font-bold transition w-full text-left">
                    <i class="ph-fill ph-road-horizon text-blue-600 text-lg"></i> Calles (OSM)
                </button>
                <button onclick="setLayer('clean')" class="flex items-center gap-2 p-2 hover:bg-gray-100 rounded-lg text-gray-600 text-xs font-bold transition w-full text-left">
                    <i class="ph-fill ph-map-trifold text-gray-400 text-lg"></i> Limpio
                </button>
                <button onclick="setLayer('sat')" class="flex items-center gap-2 p-2 hover:bg-green-50 rounded-lg text-gray-600 text-xs font-bold transition w-full text-left">
                    <i class="ph-fill ph-globe-hemisphere-west text-green-700 text-lg"></i> Satélite
                </button>
            </div>
        </div>
    </div>

    <div id="view-stats" class="view-panel container mx-auto p-6 overflow-y-auto custom-scroll">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-10">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100"><div id="chart1" class="w-full h-[300px]"></div></div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100"><div id="chart2" class="w-full h-[300px]"></div></div>
            <div class="bg-gradient-to-br from-[#8B0000] to-[#5a0000] p-6 rounded-2xl shadow-lg text-white flex flex-col justify-center items-center">
                <i class="ph-duotone ph-buildings text-5xl mb-2 opacity-80"></i>
                <span class="text-4xl font-bold" id="kpi-total">0</span>
                <span class="text-sm uppercase tracking-widest opacity-70">Total Centros</span>
            </div>
            <div class="md:col-span-2 lg:col-span-3 bg-white p-6 rounded-2xl shadow-sm border border-gray-100"><div id="chart3" class="w-full h-[400px]"></div></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <script>
        // === CONFIGURACIÓN ===
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR1DHcWzeJllMtxhIQlpaw6byDlbsji0L4w3SZaWTQDgdz2MdeJEGfB6peldYWgEeQUzgr0hP73zwwt/pub?output=csv'; // PEGAR ENLACE

        let rawData=[], filteredData=[], markers={}, map, layerGroup, page=1;
        const perPage=10;

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            initCharts();
            loadData();
            document.getElementById('inputSearch').addEventListener('input', () => { page=1; execFilter(); });
        });

        // --- MAPA ---
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([-16.5000, -68.1193], 12); // Zoom inicial más cercano
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            setLayer('osm'); // POR DEFECTO: CALLES DETALLADAS
            layerGroup = L.layerGroup().addTo(map);
        }

        function setLayer(type) {
            map.eachLayer(l => { if(l instanceof L.TileLayer) map.removeLayer(l); });
            let url = '';
            // CAPA 1: Calles Detalladas (OpenStreetMap Standard)
            if(type === 'osm') url = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
            // CAPA 2: Limpio (CartoDB Light)
            else if(type === 'clean') url = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
            // CAPA 3: Satélite (Esri)
            else if(type === 'sat') url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
            
            L.tileLayer(url, { attribution: 'Datos SNIS' }).addTo(map);
        }

        // --- DATOS ---
        function loadData() {
            if(CSV_URL.includes('TU_ENLACE')) return alert("⚠️ Configura el CSV en el HTML");
            Papa.parse(CSV_URL, {
                download: true, header: true, dynamicTyping: true, skipEmptyLines: true,
                complete: (res) => {
                    rawData = res.data.filter(r => r.Latitud && r.Longitud && r.NOMBRE);
                    const redes = [...new Set(rawData.map(d=>d.RED))].sort();
                    redes.forEach(r => document.getElementById('selRed').add(new Option(r,r)));
                    execFilter();
                }
            });
        }

        function filterRed() {
            const red = document.getElementById('selRed').value;
            const m = document.getElementById('selMuni');
            m.innerHTML = '<option value="">Todos</option>'; m.disabled = !red;
            if(red) [...new Set(rawData.filter(d=>d.RED===red).map(d=>d.MUNICIPIO))].sort().forEach(mu=>m.add(new Option(mu,mu)));
            page=1; execFilter();
        }

        function execFilter() {
            const txt = document.getElementById('inputSearch').value.toLowerCase();
            const red = document.getElementById('selRed').value;
            const mun = document.getElementById('selMuni').value;

            filteredData = rawData.filter(d => {
                const mt = (d.NOMBRE||'').toLowerCase().includes(txt) || String(d.COD_SNIS).includes(txt);
                return mt && (!red || d.RED===red) && (!mun || d.MUNICIPIO===mun);
            });

            document.getElementById('counter').innerText = filteredData.length;
            document.getElementById('kpi-total').innerText = filteredData.length;
            renderMap(); renderList(); updateCharts();
        }

        // --- RENDER MAPA MEJORADO ---
        function renderMap() {
            layerGroup.clearLayers();
            markers = {};
            const bounds = L.latLngBounds();

            filteredData.forEach(item => {
                // LOGICA DE COLORES E ICONOS POR NIVEL
                let lvl = String(item.NIVEL).toLowerCase();
                let cssClass = 'pin-l1'; // Default Verde
                let iconClass = 'ph-first-aid'; // Default Cruz
                let headerColor = 'bg-emerald-500';

                if(lvl.includes('2') || lvl.includes('segundo')) {
                    cssClass = 'pin-l2'; // Naranja
                    iconClass = 'ph-hospital'; // Hospital
                    headerColor = 'bg-amber-500';
                } else if (lvl.includes('3') || lvl.includes('tercer')) {
                    cssClass = 'pin-l3'; // Rojo
                    iconClass = 'ph-buildings'; // Edificio Grande
                    headerColor = 'bg-[#8B0000]';
                }

                // CREAR EL PIN PERSONALIZADO
                const icon = L.divIcon({
                    className: 'custom-div-icon', // Clase base vacía para que Leaflet no ponga cuadro blanco
                    html: `
                        <div class="pin-marker ${cssClass}">
                            <i class="ph-fill ${iconClass} pin-icon"></i>
                        </div>
                    `,
                    iconSize: [36, 36],
                    iconAnchor: [18, 36], // Punta del pin abajo al centro
                    popupAnchor: [0, -38] // Popup sale encima del pin
                });

                // POPUP "GLASS"
                const popupContent = `
                    <div class="font-sans">
                        <div class="${headerColor} h-2 w-full"></div>
                        <div class="p-5 relative">
                            <span class="absolute top-4 right-4 text-[10px] font-mono text-gray-400 border px-1 rounded">COD: ${item.COD_SNIS}</span>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wide mb-1">${item.NIVEL}</p>
                            <h3 class="text-base font-bold text-gray-800 leading-tight mb-3 pr-8">${item.NOMBRE}</h3>
                            
                            <div class="space-y-1.5 text-xs text-gray-500">
                                <div class="flex items-center gap-2"><i class="ph-fill ph-map-pin text-red-800"></i> ${item.MUNICIPIO}</div>
                                <div class="flex items-center gap-2"><i class="ph-fill ph-users-three text-red-800"></i> Red: ${item.RED}</div>
                                <div class="flex items-center gap-2"><i class="ph-fill ph-tag text-red-800"></i> ${item.SUBSECTOR}</div>
                            </div>
                        </div>
                    </div>
                `;

                const m = L.marker([item.Latitud, item.Longitud], { icon: icon })
                    .bindPopup(popupContent, { className: 'modern-popup' });
                
                m.on('click', () => map.flyTo([item.Latitud, item.Longitud], 16));

                layerGroup.addLayer(m);
                markers[item.COD_SNIS] = m;
                bounds.extend([item.Latitud, item.Longitud]);
            });

            if(filteredData.length) map.fitBounds(bounds, { padding: [50,50], maxZoom: 15 });
        }

        // --- LISTA Y GRÁFICOS (SIN CAMBIOS DE LÓGICA) ---
        function renderList() {
            const div = document.getElementById('resultList'); div.innerHTML = '';
            const maxPage = Math.ceil(filteredData.length / perPage) || 1;
            if(page > maxPage) page = maxPage; if(page < 1) page = 1;

            filteredData.slice((page-1)*perPage, page*perPage).forEach(d => {
                let border = 'border-l-emerald-500';
                let n = String(d.NIVEL).toLowerCase();
                if(n.includes('2')) border = 'border-l-amber-500';
                if(n.includes('3')) border = 'border-l-red-800';

                const el = document.createElement('div');
                el.className = `p-3 bg-white rounded-xl border border-gray-100 border-l-[4px] ${border} shadow-sm hover:shadow-md cursor-pointer transition group`;
                el.innerHTML = `
                    <h4 class="font-bold text-xs text-gray-700 group-hover:text-red-800 truncate">${d.NOMBRE}</h4>
                    <div class="flex justify-between mt-1"><span class="text-[10px] text-gray-400">${d.MUNICIPIO}</span><i class="ph-bold ph-caret-right text-gray-300"></i></div>
                `;
                el.onclick = () => { if(markers[d.COD_SNIS]) { map.flyTo([d.Latitud, d.Longitud], 17); markers[d.COD_SNIS].openPopup(); } };
                div.appendChild(el);
            });
            document.getElementById('pgInfo').innerText = `${page}/${maxPage}`;
        }
        function pg(d) { page+=d; renderList(); }

        let ch1, ch2, ch3;
        function initCharts() {
            Highcharts.theme = { colors: ['#10b981', '#f59e0b', '#991b1b', '#3b82f6'], chart: { style: { fontFamily: 'Inter' } } };
            Highcharts.setOptions(Highcharts.theme);
            ch1 = Highcharts.chart('chart1', { chart: { type: 'variablepie' }, title: { text: 'Nivel Atención' }, series: [{ minPointSize: 10, innerSize: '50%', zMin: 0, name: 'Centros', data: [] }] });
            ch2 = Highcharts.chart('chart2', { chart: { type: 'bar' }, title: { text: 'Subsector' }, xAxis: { categories: [] }, yAxis: { title: null }, legend: { enabled: false }, series: [{ name: 'Total', data: [], colorByPoint: true }] });
            ch3 = Highcharts.chart('chart3', { chart: { type: 'column' }, title: { text: 'Por Red de Salud' }, xAxis: { type: 'category' }, yAxis: { title: null }, legend: { enabled: false }, series: [{ name: 'Total', data: [], color: '#8B0000' }] });
        }
        function updateCharts() {
            const count = (k) => { const c={}; filteredData.forEach(i=>{let v=i[k]||'S/D';c[v]=(c[v]||0)+1;}); return Object.entries(c).map(([name,y])=>({name,y})).sort((a,b)=>b.y-a.y); };
            const d1 = count('NIVEL'); d1.forEach(p => { let n=p.name.toLowerCase(); if(n.includes('1')) p.color='#10b981'; if(n.includes('2')) p.color='#f59e0b'; if(n.includes('3')) p.color='#991b1b'; });
            ch1.series[0].setData(d1);
            const d2 = count('SUBSECTOR'); ch2.xAxis[0].setCategories(d2.map(x=>x.name)); ch2.series[0].setData(d2.map(x=>x.y));
            ch3.series[0].setData(count('RED'));
        }

        function setView(v) {
            document.querySelectorAll('.view-panel').forEach(e=>e.classList.remove('active')); document.getElementById('view-'+v).classList.add('active');
            const b1=document.getElementById('btn-map'), b2=document.getElementById('btn-stats');
            const activeClass = "flex items-center gap-2 px-5 py-2 rounded-lg text-xs font-bold transition-all bg-white text-[#8B0000] shadow-md transform hover:scale-105";
            const inactiveClass = "flex items-center gap-2 px-5 py-2 rounded-lg text-xs font-bold transition-all text-red-100 hover:bg-white/10";
            if(v==='map'){ b1.className=activeClass; b2.className=inactiveClass; setTimeout(()=>map.invalidateSize(),100); }
            else{ b2.className=activeClass; b1.className=inactiveClass; setTimeout(()=>{ch1.reflow();ch2.reflow();ch3.reflow()},100); }
        }
    </script>
</body>
</html>
